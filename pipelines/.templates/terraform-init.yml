parameters:
  - name: environment
    type: string
  - name: workingDirectory
    type: string
  - name: serviceConnection
    type: string
  - name: backendConfigFile
    type: string
    default: "backend.tfvars"
  - name: backendResourceGroup
    type: string
    default: "$(TF_BACKEND_RESOURCE_GROUP)"
  - name: backendStorageAccount
    type: string
    default: "$(TF_BACKEND_STORAGE_ACCOUNT)"
  - name: backendContainer
    type: string
    default: "$(TF_BACKEND_CONTAINER)"

steps:
  - script: |
      set -euo pipefail
      if ! command -v terraform >/dev/null 2>&1; then
        sudo apt-get update
        sudo apt-get install -y gnupg software-properties-common
        wget -O- https://apt.releases.hashicorp.com/gpg | \
          gpg --dearmor | \
          sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg >/dev/null
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
          sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt-get update
        sudo apt-get install -y terraform
      fi
      terraform -version
    displayName: "Ensure Terraform Is Installed"

  - task: AzureCLI@2
    displayName: "Terraform Init (${{ parameters.environment }})"
    inputs:
      azureSubscription: "${{ parameters.serviceConnection }}"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      workingDirectory: "${{ parameters.workingDirectory }}"
      inlineScript: |
        set -euo pipefail
        STORAGE_KEY=$(az storage account keys list \
          --resource-group ${{ parameters.backendResourceGroup }} \
          --account-name ${{ parameters.backendStorageAccount }} \
          --query '[0].value' -o tsv)
        terraform init \
          -backend-config="resource_group_name=${{ parameters.backendResourceGroup }}" \
          -backend-config="storage_account_name=${{ parameters.backendStorageAccount }}" \
          -backend-config="container_name=${{ parameters.backendContainer }}" \
          -backend-config="key=${{ parameters.environment }}.terraform.tfstate" \
          -backend-config="access_key=${STORAGE_KEY}"

  - task: AzureCLI@2
    displayName: "Terraform Validate"
    inputs:
      azureSubscription: "${{ parameters.serviceConnection }}"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      workingDirectory: "${{ parameters.workingDirectory }}"
      inlineScript: |
        set -euo pipefail
        terraform validate
