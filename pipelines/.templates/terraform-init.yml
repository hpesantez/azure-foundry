parameters:
  - name: environment
    type: string
  - name: workingDirectory
    type: string
  - name: serviceConnection
    type: string
  - name: backendConfigFile
    type: string
    default: "backend.tfvars"

steps:
  - script: |
      set -euo pipefail
      if ! command -v terraform >/dev/null 2>&1; then
        sudo apt-get update
        sudo apt-get install -y gnupg software-properties-common
        wget -O- https://apt.releases.hashicorp.com/gpg | \
          gpg --dearmor | \
          sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg >/dev/null
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
          sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt-get update
        sudo apt-get install -y terraform
      fi
      terraform -version
    displayName: "Ensure Terraform Is Installed"

  - task: AzureCLI@2
    displayName: "Terraform Init (${{ parameters.environment }})"
    inputs:
      azureSubscription: "${{ parameters.serviceConnection }}"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      workingDirectory: "${{ parameters.workingDirectory }}"
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail
        export ARM_CLIENT_ID=$servicePrincipalId
        export ARM_CLIENT_SECRET=$servicePrincipalKey
        export ARM_TENANT_ID=$tenantId
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
        terraform init \
          -backend-config="resource_group_name=rg-foundry-state" \
          -backend-config="storage_account_name=stfoundrytfstate" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=${{ parameters.environment }}.terraform.tfstate" \
          -backend-config="use_azuread_auth=true"

  - task: AzureCLI@2
    displayName: "Terraform Validate"
    inputs:
      azureSubscription: "${{ parameters.serviceConnection }}"
      scriptType: "bash"
      scriptLocation: "inlineScript"
      workingDirectory: "${{ parameters.workingDirectory }}"
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail
        export ARM_CLIENT_ID=$servicePrincipalId
        export ARM_CLIENT_SECRET=$servicePrincipalKey
        export ARM_TENANT_ID=$tenantId
        export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
        terraform validate
