# Azure AI Foundry - Infrastructure CD Pipeline
# Triggered on merge to main - deploys through environments with gates

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/**

pr: none

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: foundry-common

stages:
  # ============================================================
  # DEV - Auto deploy on merge
  # ============================================================
  - stage: Plan_Dev
    displayName: "Plan (Dev)"
    variables:
      - group: foundry-dev
    jobs:
      - job: Plan
        displayName: "Terraform Plan - Dev"
        steps:
          - template: .templates/terraform-init.yml
            parameters:
              environment: "dev"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infra/environments/dev"
              serviceConnection: "sp-foundry-dev"

          - template: .templates/terraform-plan.yml
            parameters:
              environment: "dev"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infra/environments/dev"
              serviceConnection: "sp-foundry-dev"

  - stage: Deploy_Dev
    displayName: "Deploy (Dev)"
    dependsOn: Plan_Dev
    variables:
      - group: foundry-dev
    jobs:
      - deployment: Apply
        displayName: "Terraform Apply - Dev"
        environment: "foundry-dev"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: .templates/terraform-init.yml
                  parameters:
                    environment: "dev"
                    workingDirectory: "$(System.DefaultWorkingDirectory)/infra/environments/dev"
                    serviceConnection: "sp-foundry-dev"

                - template: .templates/terraform-apply.yml
                  parameters:
                    environment: "dev"
                    workingDirectory: "$(System.DefaultWorkingDirectory)/infra/environments/dev"
                    serviceConnection: "sp-foundry-dev"

  # ============================================================
  # STAGING - Auto deploy after Dev success
  # ============================================================
  - stage: Plan_Staging
    displayName: "Plan (Staging)"
    dependsOn: Deploy_Dev
    variables:
      - group: foundry-staging
    jobs:
      - job: Plan
        displayName: "Terraform Plan - Staging"
        steps:
          - template: .templates/terraform-init.yml
            parameters:
              environment: "staging"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infra/environments/staging"
              serviceConnection: "sp-foundry-dev"  # Needs to change to staging SP with access to staging subscription

          - template: .templates/terraform-plan.yml
            parameters:
              environment: "staging"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infra/environments/staging"
              serviceConnection: "sp-foundry-dev"  # Needs to change to staging SP with access to staging subscription

  - stage: Deploy_Staging
    displayName: "Deploy (Staging)"
    dependsOn: Plan_Staging
    variables:
      - group: foundry-staging
    jobs:
      - deployment: Apply
        displayName: "Terraform Apply - Staging"
        environment: "foundry-staging"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: .templates/terraform-init.yml
                  parameters:
                    environment: "staging"
                    workingDirectory: "$(System.DefaultWorkingDirectory)/infra/environments/staging"
                    serviceConnection: "sp-foundry-dev"  # Needs to change to staging SP with access to staging subscription

                - template: .templates/terraform-apply.yml
                  parameters:
                    environment: "staging"
                    workingDirectory: "$(System.DefaultWorkingDirectory)/infra/environments/staging"
                    serviceConnection: "sp-foundry-dev"  # Needs to change to staging SP with access to staging subscription

  # ============================================================
  # PROD - Manual approval required
  # ============================================================
  - stage: Plan_Prod
    displayName: "Plan (Prod)"
    dependsOn: Deploy_Staging
    variables:
      - group: foundry-prod
    jobs:
      - job: Plan
        displayName: "Terraform Plan - Prod"
        steps:
          - template: .templates/terraform-init.yml
            parameters:
              environment: "prod"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infra/environments/prod"
              serviceConnection: "sp-foundry-dev"  # Needs to change to prod SP with access to prod subscription

          - template: .templates/terraform-plan.yml
            parameters:
              environment: "prod"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infra/environments/prod"
              serviceConnection: "sp-foundry-dev"  # Needs to change to prod SP with access to prod subscription

  - stage: Deploy_Prod
    displayName: "Deploy (Prod)"
    dependsOn: Plan_Prod
    variables:
      - group: foundry-prod
    jobs:
      - deployment: Apply
        displayName: "Terraform Apply - Prod"
        # This environment must have an approval gate configured in Azure DevOps
        environment: "foundry-prod"
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - template: .templates/terraform-init.yml
                  parameters:
                    environment: "prod"
                    workingDirectory: "$(System.DefaultWorkingDirectory)/infra/environments/prod"
                    serviceConnection: "sp-foundry-dev"  # Needs to change to prod SP with access to prod subscription

                - template: .templates/terraform-apply.yml
                  parameters:
                    environment: "prod"
                    workingDirectory: "$(System.DefaultWorkingDirectory)/infra/environments/prod"
                    serviceConnection: "sp-foundry-dev"  # Needs to change to prod SP with access to prod subscription
